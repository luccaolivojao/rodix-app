name: Android AAB
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npx cap sync android
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Mostrar SHA-1 da chave de upload
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -alias "$KS_ALIAS" -storepass "$KS_PASS" | grep -E "SHA1|SHA256" | sed 's/^ *//' | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/sha.txt"
      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew bundleRelease
      - name: Publica AAB na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(tr '\n' ' ' < "$RUNNER_TEMP/sha.txt")
          gh release delete aab-latest --yes --cleanup-tag || true
          gh release create aab-latest android/app/build/outputs/bundle/release/app-release.aab --title "Rodix Football (Android AAB)" --notes "Arquivo .aab assinado para enviar ao Google Play Console. Chave de upload - $SHA"
