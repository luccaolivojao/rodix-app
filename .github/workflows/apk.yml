name: Android APK (teste)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["www/**", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Publica APK na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rodix-Football.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Rodix-Football.apk --title "Rodix Football (APK de teste)" --notes "APK de teste (assinatura de debug) para instalar direto no celular."
