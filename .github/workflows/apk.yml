name: Android APK (teste)
on:
  workflow_dispatch:
  push:
    branches: [live-none]
    paths: ["www/**", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rodix-football-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publica APK na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rodix-Live.apk
          gh release delete apk-live --yes --cleanup-tag || true
          gh release create apk-live Rodix-Live.apk --title "Rodix Live (co-op)" --notes "APK de teste (assinatura de debug) para instalar direto no celular."
