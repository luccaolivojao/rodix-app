name: ASC resubmit
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'inspect ou go', default: 'inspect' }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - name: Run
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 -u scripts/asc_resubmit.py > /tmp/run.txt 2>&1 || true
          cat /tmp/asc_log.txt /tmp/run.txt > /tmp/out.txt 2>/dev/null || cp /tmp/run.txt /tmp/out.txt
          gh release delete asc-resubmit -y --cleanup-tag 2>/dev/null || true
          gh release create asc-resubmit --title asc-resubmit --notes-file /tmp/out.txt
