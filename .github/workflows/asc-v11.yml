name: ASC versão 1.1
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'inspect ou go', default: 'inspect' }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - name: Run
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 -u scripts/asc_v11.py > /tmp/asc_log.txt 2>&1 || true; echo END >> /tmp/asc_log.txt
          gh release delete asc-v11 -y --cleanup-tag 2>/dev/null || true
          gh release create asc-v11 --title asc-v11 --notes-file /tmp/asc_log.txt
