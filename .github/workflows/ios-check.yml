name: iOS compilação (sem assinatura)
on: workflow_dispatch
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx cap sync ios
      - name: Compilar sem assinar
        working-directory: ios/App
        run: |
          xcodebuild build -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS= | tail -40
          test ${PIPESTATUS[0]} -eq 0
