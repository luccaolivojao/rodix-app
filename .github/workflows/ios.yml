name: iOS TestFlight
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx cap sync ios
      - name: App Store Connect API key
        env:
          KEY_TEXT: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          OUT=~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          # aceita o texto do .p8 (-----BEGIN ...) ou o mesmo texto em base64
          case "$KEY_TEXT" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$KEY_TEXT" > "$OUT" ;;
            *) printf '%s' "$KEY_TEXT" | base64 -d > "$OUT" ;;
          esac
          head -1 "$OUT" | cut -c1-27
      - name: Archive
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee $RUNNER_TEMP/archive.log
      - name: Export and upload to App Store Connect
        working-directory: ios/App
        run: |
          cat > $RUNNER_TEMP/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
      - name: Publica resumo do erro
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "error:|warning: .*(sign|provision|entitle)|\*\* ARCHIVE FAILED|No (account|profile|signing)|Provisioning|Failed" $RUNNER_TEMP/archive.log | sort -u | head -40 > $RUNNER_TEMP/err.txt || true
          gh release delete ios-log --yes --cleanup-tag || true
          gh release create ios-log --title "iOS log" --notes-file $RUNNER_TEMP/err.txt
