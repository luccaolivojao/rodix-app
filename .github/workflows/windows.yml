name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [live-none]
    paths: ["www/**", "desktop/**", ".github/workflows/windows.yml"]
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Copiar jogo
        shell: bash
        run: cp -r www desktop/www
      - name: Build
        working-directory: desktop
        shell: bash
        run: npm install && npx electron-builder --win portable
      - uses: actions/upload-artifact@v4
        with:
          name: Rodix-Live-exe
          path: desktop/dist/Rodix-Live.exe
      - name: Publicar na aba Releases
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete windows-live --yes --cleanup-tag || true; gh release create windows-live desktop/dist/Rodix-Live.exe --title "Rodix Live (co-op .exe)" --notes "Rodix Live para Windows (ate 3 jogadores online). Baixe e execute. Todos precisam do mesmo arquivo."
