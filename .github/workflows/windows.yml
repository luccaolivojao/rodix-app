name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["www/**", "desktop/**", ".github/workflows/windows.yml"]
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Copiar jogo
        shell: bash
        run: cp -r www desktop/www
      - name: Build
        working-directory: desktop
        shell: bash
        run: npm install && npx electron-builder --win portable
      - name: Publicar na aba Releases
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete windows-latest --yes --cleanup-tag || true; gh release create windows-latest desktop/dist/Rodix-Football.exe --title "Rodix Football (Windows .exe)" --notes "Arquivo .exe portátil para Windows. Baixe e execute."
