<style>@font-face{font-family:'Big Shoulders Display';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-weight:900;font-style:normal;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format('woff2')}

@font-face{font-family:'Hanken Grotesk';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/hanken-grotesk-latin-700-normal.woff2) format('woff2')}

<style>
/* Layout: estádio à noite — painéis escuros sobre gramado, um único acento cor de refletor; a partida ocupa a tela inteira */
:root{
  --bg:#0b1611; --bg2:#0f1f17; --panel:#13261d; --panel2:#193126; --line:#264536; --line2:#335a47;
  --fg:#eaf3ec; --mut:#8ea89a; --dim:#5f7a6c;
  --acc:#ffd23f; --acc-ink:#1c1500; --good:#4cc38a; --bad:#f06262; --info:#62b6ff;
  --grass1:#2f9549; --grass2:#2a8842;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif; --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
.num,table,.tab{font-variant-numeric:tabular-nums}
.screen{position:fixed;inset:0;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.screen[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto}
.lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600}
.mut{color:var(--mut)} .good{color:var(--good)} .bad{color:var(--bad)} .acc{color:var(--acc)}
.btn{appearance:none;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:42px;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--acc)} .btn:active{transform:translateY(1px)}
.btn:focus-visible,.navb:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)} .btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line2);color:var(--mut)}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.chip.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.bar{height:6px;background:var(--bg2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:4px}
.tblw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);white-space:nowrap}
td.r,th.r{text-align:right}
tr.me td{background:color-mix(in srgb,var(--acc) 12%,transparent)}
tr.zone-up td:first-child{box-shadow:inset 3px 0 var(--good)} tr.zone-down td:first-child{box-shadow:inset 3px 0 var(--bad)} tr.zone-ch td:first-child{box-shadow:inset 3px 0 var(--acc)}
.ovr{font-family:var(--display);font-weight:800;font-size:15px;display:inline-block;min-width:30px;text-align:center;padding:1px 5px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2)}
.ovr.hi{color:var(--acc-ink);background:var(--acc);border-color:var(--acc)}
input[type=text],input[type=number],select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
input[type=range]{width:100%;accent-color:var(--acc)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line2);background:var(--bg2);border-radius:7px;padding:7px 10px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line2);cursor:pointer;padding:0}
.sw[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
/* menu */
.screen.gamebg{padding:0}
.hero{max-width:560px;width:100%;display:flex;flex-direction:column;gap:22px}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(46px,11vw,88px);line-height:.86;letter-spacing:-.01em;text-transform:uppercase}
.logo span{color:var(--acc);display:block;font-size:.42em;letter-spacing:.14em;margin-top:8px}
.menu-btns{display:grid;gap:10px}
.menu-btns .btn{justify-content:space-between;font-size:18px;min-height:56px;padding:12px 18px;font-family:var(--display);letter-spacing:.04em;text-transform:uppercase}
.saveitem{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.fine{font-size:12px;color:var(--dim);line-height:1.5}
/* hub */
#s-hub{padding:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(6px);flex-wrap:wrap}
.pchip{display:flex;gap:10px;align-items:center;min-width:0}
.pchip canvas{width:44px;height:44px;border-radius:10px;background:var(--panel2)}
.pchip #hub-name{font-family:var(--display);font-size:20px;font-weight:800;display:block;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hubbody{display:grid;grid-template-columns:210px 1fr;gap:16px;padding:16px;max-width:1280px;width:100%;margin:0 auto;flex:1}
nav.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:84px;align-self:start}
.navb{display:flex;justify-content:space-between;align-items:center;text-align:left;background:transparent;border:0;border-radius:8px;padding:10px 12px;font-weight:600;cursor:pointer;color:var(--mut)}
.navb:hover{background:var(--panel);color:var(--fg)}
.navb[aria-current=page]{background:var(--panel2);color:var(--fg);box-shadow:inset 3px 0 var(--acc)}
.badge{background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
main#view{min-width:0;padding-bottom:40px}
.pagehead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h2{font-size:34px;text-transform:uppercase}
@media (max-width:820px){
  .hubbody{grid-template-columns:1fr;padding:12px 16px}
  nav.side{flex-direction:row;overflow-x:auto;position:sticky;top:0;z-index:4;background:var(--bg);padding:4px 0;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
  nav.side::-webkit-scrollbar{display:none}
  .navb{white-space:nowrap;padding:8px 12px}
  .navb[aria-current=page]{box-shadow:inset 0 -3px var(--acc)}
  .pagehead h2{font-size:28px}
}
.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.fixture .tm{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.fixture .tm b{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.05}
.vs{font-family:var(--display);font-size:42px;font-weight:800;color:var(--acc)}
.attr{display:grid;grid-template-columns:1fr 34px;gap:2px 10px;align-items:center;font-size:14px}
.attr .bar{grid-column:1/-1;height:5px}
.attr .v{text-align:right;font-weight:700;font-family:var(--display);font-size:17px}
.bignum{font-family:var(--display);font-weight:800;font-size:56px;line-height:.9}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--mut)} .kv dd{margin:0;font-weight:600;text-align:right}
.news{display:flex;flex-direction:column;gap:8px;font-size:14px}
.sc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sc-fol{font-size:13px;color:var(--mut)}.sc-fol b{color:var(--fg);font-size:20px}
.sc-post{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.sc-post.hate{border-color:#ff5a5a}
.sc-who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sc-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#06140c;flex:none}
.sc-who small{display:block;color:var(--mut);font-size:12px}
.sc-post p{margin:0;font-size:15px;line-height:1.35}
.sc-act{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.sc-act button{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.sc-act button.on{border-color:#ff5a5a;color:#ff5a5a}
.sc-cm{margin-top:10px;padding:8px 12px;border-left:3px solid var(--acc);font-size:14px;background:rgba(255,255,255,.03);border-radius:6px}
.sc-cm b{display:block;font-size:12px;color:var(--mut)}

.news div{padding-left:10px;border-left:2px solid var(--line2)} .news div.good{border-color:var(--good)}
.opt{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.opt[aria-pressed=true]{border-color:var(--acc);background:var(--panel2)}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.clubcard{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;cursor:pointer;text-align:left}
.clubcard[aria-pressed=true]{border-color:var(--acc);background:var(--panel2)}
.clubcard .nm{font-weight:700;line-height:1.15}
/* partida */

/* dificuldade: escada de degraus */
.ladder{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.step{position:relative;display:grid;grid-template-columns:78px 1fr minmax(210px,300px);gap:6px 18px;align-items:center;text-align:left;width:100%;padding:14px 18px 14px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:inherit;cursor:pointer;overflow:hidden;transition:transform .12s,border-color .12s,background .12s}
.step::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc)}
.step:hover{background:var(--panel2)}
.step[aria-pressed=true]{border-color:var(--tc);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 16%,var(--panel2)),var(--panel2));transform:translateX(6px)}
.step .rk{display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding-left:10px}
.step .rk i{display:block;width:34px;height:7px;background:var(--line2);clip-path:polygon(0 0,50% 100%,100% 0,100% 40%,50% 100%,0 40%);height:8px}
.step .rk i{clip-path:polygon(0 0,50% 70%,100% 0,100% 45%,50% 100%,0 45%)}
.step .rk i.on{background:var(--tc)}
.step h3{font-size:26px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step .tg{font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--tc);text-transform:uppercase;letter-spacing:.06em}
.step p{margin:4px 0 0;font-size:14px;color:var(--mut)}
.step .meters{display:grid;gap:6px}
.step .mt{display:grid;grid-template-columns:116px 1fr;gap:8px;align-items:center;font-size:12.5px;color:var(--mut)}
.step .seg{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.step .seg b{height:7px;border-radius:2px;background:var(--line2)}
.step .seg b.on{background:var(--tc)}
.step .chk{position:absolute;right:12px;top:10px;font-size:12px;font-weight:700;color:var(--acc-ink);background:var(--tc);padding:2px 8px;border-radius:99px;display:none}
.step[aria-pressed=true] .chk{display:block}
.step.compact{grid-template-columns:62px 1fr;padding:10px 14px 10px 0}.step.compact .meters,.step.compact p{display:none}.step.compact h3{font-size:21px}
@media (max-width:760px){.step{grid-template-columns:56px 1fr;padding-right:12px}.step .meters{grid-column:1/-1;padding-left:14px}.step .mt{grid-template-columns:106px 1fr}.step[aria-pressed=true]{transform:none}.step .chk{top:8px}}
/* controles de toque */
#tpad{position:absolute;inset:0;pointer-events:none;z-index:5;-webkit-user-select:none;user-select:none}
#tpad[hidden]{display:none}
#joy{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:rgba(7,13,26,.45);border:2px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#joy::before{content:"";position:absolute;inset:34px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.22)}
#joyk{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe066,#f5b800);box-shadow:0 4px 12px rgba(0,0,0,.45);pointer-events:none;transition:transform .05s}
#tbtns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:236px;height:206px;pointer-events:none}
.tb{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.55);color:#fff;font-family:var(--display);font-weight:800;letter-spacing:.04em;font-size:15px;pointer-events:auto;touch-action:none;box-shadow:0 5px 14px rgba(0,0,0,.4);cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
.tb.pass{right:0;bottom:0;width:92px;height:92px;background:rgba(30,110,200,.85);font-size:18px}
.tb.shot{right:104px;bottom:34px;width:88px;height:88px;background:rgba(214,48,48,.88);font-size:18px}
.tb.lob{right:8px;bottom:104px;width:68px;height:68px;background:rgba(214,160,0,.9);color:#1a1200}
.tb.run{right:96px;bottom:134px;width:66px;height:66px;background:rgba(30,150,90,.88)}
.tb.on,.tb:active{filter:brightness(1.35);transform:scale(.94)}
.touch-on .feed{bottom:auto;top:64px;right:10px;width:min(260px,40%)}
.touch-on .hud-bot .hint{display:none}
.hints-off .hud-bot .hint{display:none}
.mvbox summary{cursor:pointer;display:inline-block;list-style:none}.mvbox summary::-webkit-details-marker{display:none}.mvbox[open] summary{margin-bottom:2px}
.touch-on .hud-bot{justify-content:flex-end}
@media (max-height:430px){#joy{width:116px;height:116px;bottom:calc(62px + env(safe-area-inset-bottom,0px))}#joyk{width:52px;height:52px;margin:-26px 0 0 -26px}#tbtns{transform:scale(.82);transform-origin:right bottom;bottom:calc(62px + env(safe-area-inset-bottom,0px))}}

#s-match{padding:0;background:#1d5d2f;overflow:hidden;touch-action:none}
#pitch{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hud-top{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:stretch;border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35);font-family:var(--display);font-weight:800;pointer-events:none;max-width:calc(100% - 24px)}
.hud-top .t{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#0d1a13;color:#fff;font-size:20px;white-space:nowrap}
.hud-top .kit{width:10px;height:22px;border-radius:3px}
.hud-top .sc{white-space:nowrap;background:#fff;color:#0d1a13;padding:6px 14px;font-size:24px;display:flex;align-items:center}
.hud-top .mn{background:var(--acc);color:var(--acc-ink);padding:6px 10px;font-size:20px;display:flex;align-items:center;min-width:56px;justify-content:center}
.screen.enter{animation:scrIn .32s ease both}@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hud-top .hb{display:flex}.hud-top .sc.pulse{animation:scPulse .9s ease}@keyframes scPulse{0%{transform:scale(1)}25%{transform:scale(1.35);background:#ffd23f}100%{transform:scale(1)}}
.hud-sub{position:absolute;left:50%;transform:translateX(-50%);top:calc(62px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:flex-start;justify-content:center;pointer-events:none;font-size:12px;color:#e9f2eb;max-width:calc(100% - 24px);flex-wrap:wrap}
.hud-sub span{background:rgba(9,20,14,.72);padding:3px 9px;border-radius:6px;white-space:nowrap}.hud-sub .cmp{background:rgba(255,210,63,.9);color:#16210f;font-weight:700}
#fxc{position:fixed;z-index:80;inset:0;width:100%;height:100%;pointer-events:none}
.goalfx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;font-family:var(--display);text-transform:uppercase;background:radial-gradient(circle at 50% 45%,rgba(255,210,63,.28),rgba(0,0,0,0) 62%)}
.goalfx.opp{background:radial-gradient(circle at 50% 45%,rgba(255,70,70,.22),rgba(0,0,0,0) 62%)}
.goalfx[hidden]{display:none}.gf-big{font-weight:900;font-size:clamp(40px,10.5vw,140px);line-height:.95;color:#fff;letter-spacing:.02em;text-shadow:0 5px 0 rgba(0,0,0,.4),0 0 40px rgba(255,210,63,.7);animation:gfIn .7s cubic-bezier(.2,1.6,.4,1) both}

.sw2{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.qleg{font-size:12.5px;color:var(--mut)}.qleg .qc{margin-left:0;margin-right:4px}
.btn.dice{padding:0;width:44px;min-width:44px;flex:none;color:var(--acc)}
.btn.dice.roll svg{animation:dice .45s ease}
@keyframes dice{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}

/* ===== Identidade: vinheta de transmissão + cores do clube do jogador =====
   --c1/--c2 vêm do clube (JS: applyClubTheme). Listras de gramado cortada no fundo, cantos chanfrados, botões inclinados, tipografia de placar. */
:root{--c1:#1f9d57;--c2:#f1efe8;--stripe:rgba(255,255,255,.028);--cut:14px}
body,.screen{background-color:var(--bg);background-image:repeating-linear-gradient(90deg,transparent 0 92px,var(--stripe) 92px 184px)}
#s-match{background-image:none}
.lbl{text-transform:none;letter-spacing:0;font-size:13px;font-weight:700;color:var(--mut)}
h1,h2,h3{letter-spacing:0}
.pagehead h2{font-size:clamp(38px,6vw,56px);font-weight:900;text-transform:none;letter-spacing:-.005em}
.card{border:0;border-radius:0;box-shadow:inset 0 0 0 1px var(--line);clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%)}
.card.next{box-shadow:inset 0 0 0 1px var(--line),inset 0 5px 0 var(--acc);padding-top:22px}
.btn{position:relative;border:0;border-radius:0;background:var(--panel2);padding:10px 24px;min-height:44px;font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:.01em;clip-path:polygon(11px 0,100% 0,calc(100% - 11px) 100%,0 100%);transition:filter .12s,background .12s}
.btn:hover{border:0;filter:brightness(1.22)}
.btn.pri{background:var(--acc);color:var(--acc-ink)}.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{font-size:16px;padding:6px 16px;min-height:36px}
.btn:focus-visible,.navb:focus-visible,.tile:focus-visible,.tabs button:focus-visible{outline:none;background:var(--fg);color:var(--bg)}
.chip{border:0;border-radius:0;text-transform:none;letter-spacing:0;font-size:13px;padding:3px 12px;background:var(--panel2);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.chip.good{background:color-mix(in srgb,var(--good) 22%,var(--panel));color:var(--good)}.chip.bad{background:color-mix(in srgb,var(--bad) 22%,var(--panel));color:var(--bad)}.chip.acc{background:color-mix(in srgb,var(--acc) 22%,var(--panel));color:var(--acc)}
.tabs{gap:4px}.tabs button{border:0;border-radius:0;background:var(--panel);padding:7px 18px;font-family:var(--display);font-size:17px;font-weight:700;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.tabs button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
.seg button{border:0;border-radius:0;background:var(--panel);clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);padding:7px 16px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
.ovr{border:0;border-radius:0;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);padding:1px 8px}
th{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:700}
.bar{border-radius:0;height:7px}.bar>i{border-radius:0}
input[type=text],input[type=number],select,textarea{border-radius:0;border:0;border-bottom:2px solid var(--line2);background:var(--bg2)}
.statgrid div{border-radius:0;background:color-mix(in srgb,var(--c1) 8%,var(--bg2));border-bottom:2px solid var(--line)}
.statgrid b,.bignum{font-weight:900}
.topbar{border-bottom:0;box-shadow:0 4px 0 var(--acc);background:color-mix(in srgb,var(--bg) 94%,transparent)}
.pchip canvas{border-radius:0;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.pchip #hub-name{font-size:26px;font-weight:900}
.navb{border-radius:0}.navb[aria-current=page]{box-shadow:inset 4px 0 var(--acc);background:var(--panel2)}
.badge{border-radius:0;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%);padding:1px 9px}
.modal .box{border:0;border-radius:0;box-shadow:inset 0 5px 0 var(--acc);padding-top:26px;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.toast{border-radius:0;font-family:var(--display);font-size:18px;font-weight:700;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding:10px 26px}
.opt,.clubcard,.saveitem,.step{border-radius:0;border:0;box-shadow:inset 0 0 0 1px var(--line)}
.opt[aria-pressed=true],.clubcard[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--acc)}
.tile{border:0;border-radius:0;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);min-height:68px;transition:filter .12s}
.tile>i{width:76px;border-right:0;background:var(--acc);color:var(--acc-ink);clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.tile>span{padding-left:6px}
.tile b{font-size:28px;font-weight:900;text-transform:none;letter-spacing:0}
.tile:hover{border:0;filter:brightness(1.18)}
.tile.big{background:var(--acc);color:var(--acc-ink);box-shadow:none}.tile.big>i{background:var(--acc-ink);color:var(--acc)}.tile.big b{font-size:44px}
.tilegrid .tile b{font-size:25px}
.logo{font-weight:900;font-size:clamp(56px,13vw,120px);line-height:.82;letter-spacing:-.015em}
.logo span{font-weight:700;font-size:.3em;letter-spacing:0;text-transform:none;color:var(--fg);margin-top:14px;display:flex;align-items:center;gap:14px}
.logo span::before{content:"";width:64px;height:10px;background:var(--acc);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
#s-menu{background-image:linear-gradient(104deg,color-mix(in srgb,var(--c1) 30%,transparent) 0 22%,transparent 22.2%),repeating-linear-gradient(90deg,transparent 0 92px,var(--stripe) 92px 184px)}
.gamebg{background-image:repeating-linear-gradient(90deg,transparent 0 92px,var(--stripe) 92px 184px)}
.screen.enter{animation:scrIn .18s ease both}@keyframes scrIn{from{opacity:0}to{opacity:1}}
.vs{font-weight:900}.fixture .tm b{font-size:28px;font-weight:900}
.step{background:var(--panel)}
.news div{border-left-width:3px}
/* partida: placar de transmissão */
.hud-top{border-radius:0;box-shadow:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,12px 100%)}
.hud-top .t{background:#101417;padding:6px 20px 6px 24px;font-size:24px;font-weight:900}.hud-top .t:last-of-type{padding:6px 24px 6px 20px}
.hud-top .sc{background:var(--fg);color:#101417;font-size:34px;font-weight:900;padding:2px 20px;min-width:96px;justify-content:center}
.hud-top .mn{background:var(--acc);color:var(--acc-ink);font-size:24px;font-weight:900;padding:6px 18px 6px 22px;min-width:70px}
.hud-sub span{border-radius:0;background:rgba(10,14,16,.8);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:3px 14px}
.hud-sub .cmp{background:var(--acc);color:var(--acc-ink);font-family:var(--display);font-size:15px;font-weight:800}
.feed div{border-radius:0;background:rgba(10,14,16,.86);border-left:3px solid var(--line2)}.feed div.g{background:var(--acc);border-left-color:var(--fg)}
.banner{font-weight:900;font-style:normal;transform:translate(-50%,-50%) skewX(-8deg)}
/* gol: faixa diagonal na cor do time */
.goalfx{background:none;overflow:hidden}
.goalfx::before{content:"";position:absolute;left:-10%;right:-10%;top:28%;height:42%;background:var(--gf,var(--acc));transform:skewY(-5deg);animation:gfBand .5s cubic-bezier(.15,.9,.2,1) both;box-shadow:0 14px 0 rgba(0,0,0,.35)}
.goalfx.opp::before{background:var(--gf,#d33)}
@keyframes gfBand{from{transform:translateX(-120%) skewY(-5deg)}to{transform:skewY(-5deg)}}
.goalfx>*{position:relative}
.gf-big{font-weight:900;font-size:clamp(48px,11vw,170px);max-width:94vw;color:var(--gfink,#fff);text-shadow:none;transform:skewX(-8deg);letter-spacing:-.01em}
.goalfx.opp .gf-big{font-size:clamp(40px,10vw,120px);text-shadow:none}
.gf-who{color:var(--gfink,#fff);font-size:clamp(24px,5vw,52px);font-weight:800;margin-top:2px;opacity:.95}
.gf-sub{display:inline-block;background:#101417;color:#fff;padding:3px 16px;margin-top:10px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);font-size:clamp(14px,2.2vw,20px)}
.phasefx{background:none;padding:0;top:36%;align-items:flex-start;padding-left:6%;animation:pfIn .45s cubic-bezier(.15,.9,.2,1) both}
.pf-t,.pf-s{display:inline-block;padding:2px 26px 2px 30px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.pf-t{background:var(--fg);color:#101417;font-size:clamp(34px,7vw,72px);font-weight:900;letter-spacing:0}.pf-s{background:var(--acc);color:var(--acc-ink);font-size:clamp(28px,5vw,52px);font-weight:900;margin-top:-2px}
/* abertura da partida: tela dividida nas cores dos dois times */
.kickintro{background:linear-gradient(104deg,var(--k0,#1d6b3d) 0 50%,var(--k1,#2b2b2b) 50.2% 100%);padding:0;gap:0;justify-content:flex-end;align-items:stretch;text-align:left}
.kickintro::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,11,13,.92),rgba(8,11,13,.35) 60%,rgba(8,11,13,.2))}
.kickintro>*{position:relative}
.ki-row{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:end;padding:0 5vw}
.ki-tm{align-items:flex-start;font-weight:900;font-size:clamp(34px,9vw,118px);line-height:.88;text-transform:uppercase;padding-bottom:3vh}.ki-tm:last-child{align-items:flex-end;text-align:right}
.ki-tm svg{width:clamp(70px,13vw,150px);height:auto;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
.ki-vs{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) skewX(-8deg);font-size:clamp(40px,10vw,120px);color:var(--fg);mix-blend-mode:normal}
.ki-comp{align-self:flex-start;margin:0 0 0 5vw;background:var(--acc);color:var(--acc-ink);font-size:clamp(15px,2.4vw,24px);font-weight:800;letter-spacing:0;padding:3px 24px 3px 28px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);margin-bottom:12px;text-transform:none}
.ki-meta{padding:12px 5vw 4vh;font-size:clamp(14px,2vw,18px);color:#e8efe9;letter-spacing:0;display:flex;justify-content:space-between;gap:12px}.ki-go{position:absolute!important;right:5vw;bottom:4vh;letter-spacing:.04em;font-size:13px;color:var(--fg);opacity:.85}
/* telas de campeonato: cor da competição + numerais gigantes */
.cintro{background:var(--ci1,#14572f);background-image:linear-gradient(104deg,rgba(0,0,0,.34) 0 46%,transparent 46.2%),repeating-linear-gradient(90deg,transparent 0 92px,rgba(255,255,255,.045) 92px 184px);align-items:stretch;justify-content:flex-start;padding:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cintro::after{content:attr(data-big);position:absolute;right:-1vw;bottom:-6vw;font-family:var(--display);font-weight:900;font-size:clamp(160px,34vw,560px);line-height:.8;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.2);pointer-events:none;white-space:nowrap}
.ci-box{width:100%;max-width:none;flex-direction:row;align-items:stretch;gap:clamp(18px,4vw,64px);text-align:left;padding:clamp(22px,6vh,64px) 5vw;margin:0;position:relative;z-index:2;flex-wrap:wrap}
.ci-head{flex:1 1 360px;display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}
.ci-side{flex:1 1 340px;display:flex;flex-direction:column;justify-content:center;gap:12px;align-items:stretch;min-width:0}
.ci-season{font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,30px);letter-spacing:0;text-transform:none;color:var(--ci2,#ffd23f);animation:none}
.ci-name{font-weight:900;font-size:clamp(52px,12vw,150px);line-height:.84;text-transform:uppercase;text-shadow:none;letter-spacing:-.01em;animation:ciName .55s cubic-bezier(.15,.9,.2,1) both;overflow-wrap:normal}
@keyframes ciName{from{transform:translateX(-60px);opacity:0}to{transform:none;opacity:1}}
.ci-fmt{font-size:clamp(15px,2vw,19px);color:#fff;opacity:.9;font-weight:600;animation:none;max-width:34ch}
.ci-card{background:rgba(8,12,12,.78);border:0;border-radius:0;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%);box-shadow:inset 0 5px 0 var(--ci2,#ffd23f);padding:20px 20px 16px;animation:none}
.ci-mine{font-size:34px;font-weight:900;text-transform:none}
.ci-opp span{border-radius:0;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding:4px 16px}
.ci-trophy{filter:none;animation:none;align-self:flex-start;margin-bottom:6px}
#ci-go{align-self:flex-start;font-size:24px;padding:12px 40px;min-height:52px;background:var(--ci2,#ffd23f);color:#101417}
@media (max-height:560px){.ci-box{padding:12px 4vw;gap:10px}.ci-head{gap:6px}.ci-side{gap:8px}#ci-go{font-size:20px;padding:8px 28px;min-height:44px}}
@media (max-width:700px){.ci-box{padding:22px 18px}.cintro{background-image:linear-gradient(104deg,rgba(0,0,0,.3) 0 30%,transparent 30.2%)}.kickintro{background:linear-gradient(104deg,var(--k0) 0 50%,var(--k1) 50.2% 100%)}}
/* celular na horizontal (telas baixas): layout compacto */
@media (max-height:520px) and (orientation:landscape){
  .screen{padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
  .screen.gamebg{padding:0}
  #s-menu .menu-body{max-width:none;height:100%;padding:8px calc(18px + env(safe-area-inset-right,0px)) 8px calc(18px + env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);grid-template-rows:auto auto;column-gap:28px;row-gap:10px;align-content:center;align-items:center}
  #s-menu .logo{grid-column:1;grid-row:1/3;align-self:center;font-size:clamp(40px,11vh,64px);margin:0}
  #s-menu .logo span{font-size:.34em;margin-top:8px}
  #s-menu .tile.big{grid-column:2;grid-row:1;max-width:none;min-height:54px;align-self:end}
  #s-menu .tile.big b{font-size:30px}
  #s-menu .tile.big>i{width:60px}
  #s-menu .tilegrid3{grid-column:2;grid-row:2;grid-template-columns:1fr 1fr;gap:8px 10px;align-self:start}
  .tile{min-height:46px}
  .tile b{font-size:19px}
  .tile small{display:none}
  .tile>i{width:46px}
  .tile>span{padding:4px 10px 4px 4px}
  .pagehead h2{font-size:24px}
  .pagehead{margin-bottom:6px}
  .card{padding:10px}
  .wrap{padding-top:0;padding-bottom:0}
  .band-in{padding:calc(6px + env(safe-area-inset-top,0px)) 14px 6px}
  .band.slim .band-in{padding:calc(5px + env(safe-area-inset-top,0px)) 14px 5px}
  .brand.sm{font-size:16px}
  .band .pchip #hub-name{font-size:16px}
  .band .pchip #hub-sub{font-size:11px}
  .band .pchip canvas{width:30px;height:30px}
}
#tpad{opacity:var(--po,1)}
#joy{scale:var(--ps,1);transform-origin:left bottom}
#tbtns{scale:var(--ps,1);transform-origin:right bottom!important}
.pad-lefty #joy{left:auto;right:calc(22px + env(safe-area-inset-right,0px));transform-origin:right bottom}
.pad-lefty #tbtns{right:auto;left:calc(18px + env(safe-area-inset-left,0px));transform-origin:left bottom!important}
#padedit{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 50%,transparent 0 22vh,rgba(255,255,255,.35) 22vh calc(22vh + 2px),transparent calc(22vh + 2px)),repeating-linear-gradient(90deg,#2f9549 0 90px,#2a8842 90px 180px)}
#padedit[hidden]{display:none}
.pe-top{position:absolute;left:0;right:0;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:rgba(7,13,26,.78);color:#fff;font-size:13px}
.pe-top label{display:flex;align-items:center;gap:6px}.pe-top input[type=range]{width:110px}
#tpad.editing #joy,#tpad.editing .tb{outline:2px dashed #ffd23f;outline-offset:4px;cursor:grab;touch-action:none}

#rp{position:fixed;inset:0;z-index:120;background:#000}#rp[hidden]{display:none}
#rpc{width:100%;height:100%;display:block}
#rp::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 130px rgba(0,0,0,.7)}
.rp-bar{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;pointer-events:none}
.rp-tag{background:var(--acc,#ffd23f);color:#111;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;padding:4px 20px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.rp-sub{background:rgba(8,12,10,.82);color:#fff;padding:7px 14px;font-weight:700;font-size:14px}
.rp-sub:empty{display:none}
.rp-skip{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:2}
.rp-prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2);z-index:2}.rp-prog i{display:block;height:100%;width:0;background:var(--acc,#ffd23f)}
#var{position:fixed;inset:0;z-index:110;display:flex;align-items:center;justify-content:center;background:rgba(2,6,4,.6);padding:16px}#var[hidden]{display:none}
.var-box{position:relative;overflow:hidden;width:min(520px,100%);background:#08130f;border:2px solid #4cc9f0;padding:20px 22px 18px;text-align:center}
.var-logo{display:inline-block;background:#4cc9f0;color:#06222c;font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:.14em;padding:0 22px 0 30px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.var-t{font-family:var(--display);font-size:24px;margin:10px 0 2px}
.var-s{color:#9fd8e8;min-height:22px;font-weight:600}
.var-res{font-family:var(--display);font-size:32px;margin-top:6px;min-height:40px}.var-res.ok{color:#38d39f}.var-res.no{color:#ff5a5a}
.var-scan{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,#4cc9f0,transparent);animation:varscan 1.1s linear infinite}
@keyframes varscan{from{top:0}to{top:100%}}
.var-skip{margin-top:12px}
.gol-nom{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line,rgba(255,255,255,.12))}.gol-nom:first-of-type{border-top:0}
.gol-nom.win b.n{color:var(--gold1,#ffd23f)}
#tut{position:fixed;inset:0;z-index:70}#tut[hidden]{display:none}
.tut-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 200vmax rgba(2,6,4,.76);border:3px solid var(--acc);transition:left .25s,top .25s,width .25s,height .25s;pointer-events:none}
.tut-hole.none{width:0!important;height:0!important;border:0;left:50%!important;top:50%!important}
.tut-box{position:fixed;width:min(400px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.55);color:var(--fg)}
.tut-box h3{margin:0 0 6px;font-family:var(--display);font-size:26px;letter-spacing:.02em;text-transform:uppercase;color:var(--acc)}

function mkClubs(spec) {
  const used = new Set(); const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  return spec.split(';').map(s => {
    const [name, r] = s.split(':'); const w = strip(name).replace(/[^A-Za-z0-9 ]/g, '').split(' ').filter(Boolean);
    const skip = /^(FC|SC|AS|US|SV|VfL|VfB|FSV|TSV|SK|KV|KRC|RFC|CF|CD|UD|AD|SD|Real|Club|De|Jong|1|The)$/i;
    const main = w.filter(x => !skip.test(x)); const base = (main[0] || w[0] || 'XXX');
    let code = base.slice(0, 3).toUpperCase(); let k = 0; const alt = (main[1] || w[1] || '');
    while (used.has(code)) { code = k < alt.length ? (base.slice(0, 2) + alt[k]).toUpperCase() : base.slice(0, 2).toUpperCase() + (k - alt.length + 2); k++; }
    used.add(code);
    let h = 7; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0; const hue = h % 360; const l = 0.42 + ((h >> 9) % 14) / 100;
    const f = (n, a) => { const kk = (n + hue / 30) % 12; const q = 0.62 * Math.min(l, 1 - l); const v = l - q * Math.max(-1, Math.min(kk - 3, 9 - kk, 1)); return Math.round(v * 255).toString(16).padStart(2, '0'); };
    return [name, code, +r, '#' + f(0) + f(8) + f(4), (h >> 5) % 3 === 0 ? '#151515' : '#ffffff'];
  });
}

function diffPicker(sel, compact) {
  return `<div class="ladder">${Object.entries(DIFFS).map(([k, D], i) => {
    const seg = n => `<span class="seg">${Array.from({ length: 10 }, (_, j) => `<b class="${j < n ? 'on' : ''}"></b>`).join('')}</span>`;
    const rk = `<span class="rk">${[0, 1, 2, 3].map(j => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</span>`;
    return `<button type="button" class="step ${compact ? 'compact' : ''}" data-diff="${k}" aria-pressed="${sel === k}" style="--tc:${D.col}">${rk}<div><h3>${D.n}<span class="tg">${D.tag}</span></h3><p>${D.d}</p></div>

  }).join('')}</div>`;
}
function diffFx(k) { const D = DIFFS[k]; const s = v => (v >= 0 ? '+' : '−') + Math.abs(v); const x = v => '×' + String(v).replace('.', ','); return `Adversários ${s(D.opp)} de força · lesões ${x(D.hurt)} · cartões ${x(D.cards)} · evolução ${x(D.grow)} · confiança do técnico ${x(D.trust)} · rivais de posição ${s(D.rival)}`; }

  if (want === padShown) return; padShown = want;

  if (!want) { KB.keys = {}; sprintBtn = false; if (KB.ch) { KB.ch = null; if (E) E.aimHold = false; } $('#joyk').style.transform = ''; document.querySelectorAll('.tb.on').forEach(b => b.classList.remove('on')); }
}
function bindPad() {
  const joy = $('#joy'), knob = $('#joyk'); let jid = null;
  const setKeys = (dx, dy) => { const k = KB.keys, T = 0.32; { const L = Math.hypot(dx, dy); KB.joy = L > 0.25 ? [dx / L, dy / L] : null; } k.left = dx < -T; k.right = dx > T; k.up = dy < -T; k.down = dy > T; k.sprint = sprintBtn || Math.hypot(dx, dy) > 0.88; };
  const jm = e => { const r = joy.getBoundingClientRect(), R = r.width / 2; let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R); const L = Math.hypot(dx, dy); if (L > R) { dx *= R / L; dy *= R / L; } knob.style.transform = `translate(${dx}px,${dy}px)`; setKeys(dx / R, dy / R); };
  joy.addEventListener('pointerdown', e => { jid = e.pointerId; joy.setPointerCapture(jid); KB.used = true; jm(e); e.preventDefault(); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === jid) jm(e); });
  const je = e => { if (e.pointerId !== jid) return; jid = null; knob.style.transform = ''; setKeys(0, 0); };
  joy.addEventListener('pointerup', je); joy.addEventListener('pointercancel', je);
  document.querySelectorAll('.tb').forEach(b => {
    const kind = b.dataset.k; let bid = null;
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); if (MU && MU.paused) return; b.setPointerCapture(e.pointerId); bid = e.pointerId; b.classList.add('on'); KB.used = true; vib('tap');
      if (kind === 'sprint') { sprintBtn = true; KB.keys.sprint = true; return; }
      if (!kbActive() || E.pause > 0 || KB.ch) return;
      KB.ch = { kind, t0: performance.now(), btn: b }; E.aimHold = true;
    });
    const end = e => {
      if (e.pointerId !== bid) return; bid = null; b.classList.remove('on');
      if (kind === 'sprint') { sprintBtn = false; KB.keys.sprint = false; return; }
      if (!KB.ch || KB.ch.btn !== b) return; const held = kbPower();
      if (kbActive() && E.pause <= 0) kbRelease(kind, held);

    };
    b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end);

}

function showTitles(sum, after) {

  const x = t[0]; const id = Object.keys(COMPDEF).find(k => COMPDEF[k].n === x.t) || Object.keys(LDEF).find(k => LDEF[k].n === x.t) || 'UCL';
  const [c1, c2] = compStyle(id); const el = $('#cintro'); el.style.setProperty('--ci1', c1); el.style.setProperty('--ci2', c2);

  { const nm = el.querySelector('.ci-name'), lw = Math.max(...String(x.t).split(/\s+/).map(w => w.length), 5); nm.style.fontSize = Math.max(40, Math.min(150, (innerWidth > 760 ? innerWidth * 0.5 : innerWidth - 40) / (lw * 0.6))) + 'px'; }
  el.hidden = false; sfx('fanfare'); FXP = []; const cols = [c2, '#ffffff', c1, '#ffd23f'];
  const burst = () => { if (el.hidden) return; const w = innerWidth, h = innerHeight; for (let i = 0; i < 70; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, v = 280 + Math.random() * 520; FXP.push({ x: w / 2, y: h * 0.7, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 4 + Math.random() * 5, c: cols[i % 4], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, life: 3 }); } };
  burst(); const iv = setInterval(() => { if (el.hidden) clearInterval(iv); else burst(); }, 1400);

}

n en donne un meilleur.","Si c'est si facile, la place de titulaire est libre. Présente-toi.","Merci pour l'interaction, ça booste ma portée. 😉","Que d'énergie pour quelqu'un qui dit ne pas m'aimer.","Tu me suis juste pour dire du mal ? C'est de l'amour, allez.","Je vais passer ton profil à l'équipe marketing : de bons chiffres.","10 sur 10 en râlerie. En football, j'attends encore.","Tu me critiques mais tu regardes tous les matchs, non ? 👀","Tes supporters de canapé ne tirent pas les coups francs, moi si.","Regarde le score dimanche et après on en reparle.","Continue comme ça, mon niveau te remercie. 😂","Si tu t'énerves, respire. Le foot n'est qu'un jeu.","Suis-moi en retour et je te montre ce qu'est une passe.","Ce commentaire restera en souvenir quand j'aurai renversé le match.","Parie ce que tu veux : mon prochain but est pour toi. 🎯","Je ris avec les supporters. Merci pour l'audience !","Aujourd'hui mon pied était en congé, demain il reprend le travail. 😅","Si j'avais su que je serais autant critiqué, je serais devenu streamer.","La note baisse et les mèmes montent. L'équilibre, c'est tout.","C'était juste un exercice de patience pour les supporters. 🤣","C'est la faute des nouveaux crampons, mais on a fait la paix.","Le ballon et moi sommes fâchés, mais on s'est réconciliés au vestiaire.","Je promets que mon prochain tir ira au moins en direction du but. 😂","Le gardien était inspiré, l'arbitre aussi. Moi, j'ai juste participé.","Même la VAR ne m'a pas sauvé cette fois, mais je continue.","Mon pied gauche a démissionné, mais le droit est resté. 🦶","Le seul qui souffre plus ici, c'est mon kiné.","On m'a traité de tout, sauf de quelqu'un qui abandonne. Allez !","Si le but était plus grand, j'aurais marqué, je le jure.","Désolé pour l'action, mon GPS était éteint. 🧭","Je n'ai raté que pour mettre du suspense. Stratégie de scénario.","Le ballon était plus glissant qu'un message dans le groupe de famille.","Je m'entraîne à une chose, une autre sort en match. Mystères du foot.","Je promets une chanson dédiée si je marque dimanche. 🎶","Aujourd'hui ma prestation était de l'art moderne : personne n'a compris.","Attention au hater, il pourrait devenir mon fan à la prochaine journée. 😁","Celui qui travaille en silence fait du bruit sur le terrain. Allons-y !","Je n'abandonnerai pas. Le meilleur reste à venir. 💪","Chaque critique devient du carburant pour le prochain match.","Le rêve est grand et je cours après chaque jour.","On est arrivés ici à la sueur et c'est à la sueur qu'on continuera.","Les champions se forgent dans les mauvais jours. Aujourd'hui en est un.","Je crois en mon travail et en mon équipe. On continue !","Ceux qui croient n'abandonnent jamais. Dimanche, il y en aura plus.","La défaite d'aujourd'hui est la motivation de demain.","Entraînement dur, tête sur les épaules, focus sur le prochain match. 🔥","Peu importe ce qu'on dit, ce qui compte c'est ce que je donne sur le terrain.","Foi, concentration et force. Le reste n'est que conséquence.","Mon histoire s'écrit encore, et le meilleur chapitre arrive.","Merci à ceux qui croient en moi, vous êtes ma force.","Le ballon est rond et la vie tourne. Tournons cette page.","Aujourd'hui était difficile, demain sera meilleur. Toujours.","La persévérance bat le talent quand le talent ne persévère pas.","Les haters me rendent plus fort, les supporters me donnent plus d'inspiration.","La tête haute et les yeux sur le prochain défi. ⚽","Rien n'ébranle celui qui connaît sa valeur. Au travail !","Les chiffres montrent la progression, jette un œil à mes statistiques.","Ça n'a été que quelques minutes sur le terrain, mais je peux en montrer plus au prochain match.","L'équipe joue avec un nouveau système et je m'adapte encore.","J'ai fait ce que l'entraîneur a demandé. Lire le jeu est un travail collectif.","Mon niveau a augmenté ces dernières semaines. Regarde mon profil.","Leur défense était fermée, c'est difficile de trouver de l'espace comme ça.","La stratégie d'aujourd'hui ne fav
